[package]
name = "solidcraft-cli"
description = "SolidCraft headless CLI: run command scripts, measure, export, render snapshots, replay oracle recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "solidcraft-cli"

[lints]
workspace = true

[[bin]]
name = "solidcraft-cli"
path = "src/main.rs"

# Compatibility alias for the CLI's former name: forwards to solidcraft-cli with a deprecation
# note on stderr. Shipped in every package for at least one release.
[[bin]]
name = "solvecraft-cli"
path = "src/alias.rs"

[features]
# The kernel backends: OpenCASCADE through cadrum is the default (`cadrum` is kept for
# scripts that name it); `cargo run -p <this> -F truck` builds the pure-Rust truck backend.
cadrum = ["solidcraft-engine/cadrum"]
truck = ["solidcraft-engine/truck"]

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-gpu = { workspace = true }
solidcraft-mcp = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Snapshot tests decode the pictures to compare them with a tolerance.
image = { workspace = true }
