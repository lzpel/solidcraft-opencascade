[package]
name = "solidcraft-kernel"
description = "SolidCraft B-rep kernel boundary: solids, extrude/revolve/booleans/fillets, tessellation, measures and STEP, behind our own API. Selects the geometry backend by feature: `truck` (default) or `cadrum` (OpenCASCADE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["truck"]
# The pure-Rust truck backend (crates/kernel-truck).
truck = ["dep:solidcraft-kernel-truck"]
# The OpenCASCADE backend through cadrum (crates/kernel-cadrum). Wins when both are enabled, so
# feature unification across the workspace cannot pick truck by accident.
cadrum = []

[dependencies]
solidcraft-kernel-core = { workspace = true }
solidcraft-kernel-truck = { workspace = true, optional = true }
